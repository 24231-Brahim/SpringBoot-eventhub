server:
    port: 8081

spring:
    datasource:
        url: jdbc:postgresql://localhost:5432/eventhub
        username: postgres
        password: postgres
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
    jackson:
        serialization:
            write-dates-as-timestamps: false

app:
    jwt:
        secret: 6f7f3f8f7a0f6d2a2a1c7b4e5d9a0b8c6d3e1f7a9b2c5d6e8f1a3b4c5d6e7f8
        expiration-ms: 86400000

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html
        urls[0]:
            url: /v3/api-docs
            name: Event Booking API
